# Consumer config for lenaxia/ai-workflows itself (self-dogfooding).
#
# This repo consumes its OWN reusable workflows so changes to the review/router
# pipeline are validated on real PRs here before/after release, instead of only
# by `go test` (which covers route-command.sh and the renderer, not the live
# workflow YAML, the LLM call, or prompt assembly).
#
# Fork policy mirrors the other non-gokore consumers (the command templates are
# goKore-derived: rathena-client packets, hook events, builders, docs/07_WORK_LOG)
# EXCEPT for five files this repo intentionally RENDERS:
#
#   - pr-review.md            — so template changes (e.g. the commit-reviewed directive)
#                               flow through and get exercised by real reviews here.
#   - core-rules.md           — the shared spine is generic (TDD, Assumptions, Zero Tech
#                               Debt); gokore-specifics live in {{ block }} slots that
#                               render empty, so the rendered file is correct for any repo.
#   - commands-footer.md      — generic command-reference table; repo-agnostic.
#   - renovate-analysis.md    — the Renovate-PR analysis prompt consumed by the reusable
#                               renovate-analysis.yml; rendering it here exercises the
#                               exact prompt consumers receive (see self-renovate-analysis.yml).
#   - issue-responder.md      — the issue-responder prompt consumed by the reusable
#                               issue-opened.yml; rendering it here exercises the exact
#                               prompt consumers receive (see self-issue-opened.yml). The
#                               gokore fragments live in {{ block }} slots overridden by
#                               consumers/ai-workflows/issue-responder.md.
#
# context.md is consumer-owned (never had a template).
#
# Rendered files are produced by `ai-sync render` and carry a managed-file banner.
# The caller workflows live at .github/workflows/self-*.yml (the reusable workflow
# definitions already occupy the canonical pr-review.yml / ai-comment.yml /
# issue-opened.yml / renovate-analysis.yml names in this repo, so the dogfood
# callers use a `self-` prefix).
#
# NOTE: self-ai-comment.yml is wired up for /review only (the sole command
# whose prompt ships). The other command prompts (fix.md, implement.md, …)
# are forked (gokore-contaminated) and must be written from scratch before
# those commands work here; expand self-ai-comment.yml's filter in the same PR
# that ships them. tests/workflows/prompt_coverage_test.go enforces the
# filter/prompts contract.

name: ai-workflows
version: v0.2.19

vars:
  project_name: ai-workflows
  rules_doc: README.md

forked:
  - context.md
  - analyze.md
  - code-change-workflow.md
  - design.md
  - explain.md
  - fix.md
  - help.md
  - implement.md
  - merge.md
  - security.md
  - test.md
  - triage.md

# Per-repo override files. Each name maps to consumers/ai-workflows/<name>.md.
# Each file can define multiple {{ define "block_name" }} blocks that fill
# {{ block "block_name" . }} slots in the matching template.
# - issue-responder.md: defines issue_responder_rules_doc (README pointer) +
#   issue_responder_constraints (guard tests + propagation contract)
blocks:
  - issue-responder

