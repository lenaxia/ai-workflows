# Consumer config for lenaxia/TinyRSVP.
#
# TinyRSVP uses ai-workflows for the workflow PLUMBING only (reusable
# workflows, route-command.sh, post-footer.sh, the formal-blocking-review
# directive). It owns all of its own prompts: they are RSVP-specific (Chi
# router, SQLite/PostgreSQL, OIDC + Forward Auth, token-based guest access,
# email queue, XSS/CSRF/SQL-injection checks).
#
# The shared template prompts are gokore-derived (rathena-client packets, hook
# events, builders, docs/07_WORK_LOG) and are wrong for TinyRSVP — rendering
# them would clobber correct prompts. So every prompt file is forked until the
# templates converge to a generic spine.
#
# This mirrors the convention used by llmsafespaces.yaml and
# rathena-client.yaml (fork all command prompts). Unlike those two, TinyRSVP
# has no consumers/tinyrsvp/core-rules.md override block, so core-rules.md is
# forked too rather than rendered with the goKore spine.
#
# context.md is consumer-owned (100% per-repo). Sync never touches it.
#
# To converge a prompt later: either (a) keep it forked and edit it in the
# consumer repo, or (b) add a consumers/tinyrsvp/<name>.md override block and
# move the file out of `forked`.

name: tinyrsvp
version: v0.1.0

vars:
  project_name: TinyRSVP
  rules_doc: README-LLM.md

forked:
  - context.md
  - core-rules.md
  - analyze.md
  - code-change-workflow.md
  - commands-footer.md
  - design.md
  - explain.md
  - fix.md
  - help.md
  - implement.md
  - issue-responder.md
  - merge.md
  - pr-review.md
  - renovate-analysis.md
  - security.md
  - test.md
  - triage.md

blocks: []
