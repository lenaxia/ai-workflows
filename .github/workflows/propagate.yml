# Propagate — on tag push, render all consumers and open sync PRs.
#
# When a new ai-workflows version is tagged (v0.1.2 -> v0.2.0), this workflow:
#   1. Renders every consumer's prompt files using the new templates
#   2. Bumps the @<tag> and version: in each consumer's workflow files via sed
#      (the uses: ref is a hardcoded literal - no vars indirection is possible)
#   3. Opens a PR in each consumer repo with both changes (prompts + pin bump)
#
# It also bumps THIS repo's own dogfood pins (self-pr-review.yml,
# self-ai-comment.yml, consumers/ai-workflows.yaml) and regenerates the
# rendered prompts that carry the version banner - opening a self-PR for
# review. Without that dogfood-bump job the pins silently drift (they were
# stuck at v0.2.1 across v0.2.2/v0.2.3 until PR #20 caught them up manually).
#
# The PRs are NOT auto-merged (per design decision: review each sync).
# Consumers can enable auto-merge individually if they choose.
#
# Triggered manually via workflow_dispatch for testing, or by tag push.
#
# AUTH (three tiers, resolved per run — see the Resolve auth steps):
#   1. GitHub App (preferred, rotation-free): AI_WORKFLOWS_APP_ID +
#      AI_WORKFLOWS_APP_PRIVATE_KEY secrets mint a 1h installation token via
#      actions/create-github-app-token. The app needs Contents RW,
#      Pull requests RW, Workflows RW on this org's repos (including the
#      private consumer gokore and THIS repo for dogfood-bump). The private
#      key never expires - regenerate only on suspicion - so there is no
#      PAT-style rotation to schedule.
#   2. AI_WORKFLOWS_PAT (legacy): classic PAT with repo + workflow scope.
#   3. GITHUB_TOKEN (last resort): public-consumer read-only fallback.
#   Tiers 1 and 2 can open cross-repo sync PRs and push workflow-file
#   changes; tier 3 cannot (it renders + diffs public consumers only and
#   skips every PR step with a visible ::warning::).
#
#   Pre-fix history: an empty AI_WORKFLOWS_PAT made actions/checkout@v6 fail
#   with a generic "Input required and not supplied: token" - blocking all
#   consumer sync from v0.2.2 through v0.2.4.

name: Propagate

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version to propagate (defaults to the pushed tag / latest)"
        required: false
      consumer:
        description: "Single consumer to target (defaults to all)"
        required: false

jobs:
  # dogfood-bump catches THIS repo's own dogfood pins up to the just-pushed
  # tag and regenerates the rendered prompts whose banner embeds the version.
  # It runs on the default GITHUB_TOKEN (same-repo), so it works even when
  # AI_WORKFLOWS_PAT is not set. The consumer-matrix `propagate` job below
  # handles OTHER repos; this job handles the dogfood repo itself.
  #
  # Skipped on single-consumer workflow_dispatch (nothing to dogfood-bump
  # for one consumer).
  dogfood-bump:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.consumer == '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Detect app credentials
        # The secrets context is not reliably usable in a step `if:`, so a
        # bash probe reads the two app secrets from env and the token-mint
        # step below is gated on this output. Skipped minting when the
        # secrets are absent keeps the PAT/GITHUB_TOKEN tiers reachable.
        id: appdetect
        env:
          APP_ID: ${{ secrets.AI_WORKFLOWS_APP_ID }}
          APP_KEY: ${{ secrets.AI_WORKFLOWS_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate app token
        # Mints a 1h installation token (Contents/PR/Workflows RW on every
        # repo the app is installed on). A misconfigured key fails loudly
        # here rather than silently degrading - that is intentional.
        id: app_token
        if: steps.appdetect.outputs.has_app == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AI_WORKFLOWS_APP_ID }}
          private-key: ${{ secrets.AI_WORKFLOWS_APP_PRIVATE_KEY }}

      - name: Resolve auth (dogfood-bump)
        # The dogfood-bump commit modifies .github/workflows/self-*.yml
        # (the dogfood pin sites). The GITHUB_TOKEN CANNOT push commits
        # that touch .github/workflows/* - this is a policy-level
        # restriction on all GitHub-App-backed tokens, NOT a scope issue,
        # so no `permissions:` key can override it. Only a credential with
        # the Workflows grant can push such a commit: the GitHub App token
        # (tier 1) or AI_WORKFLOWS_PAT (tier 2). When neither is available,
        # the push step below is skipped with a ::warning::.
        id: auth
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          PAT: ${{ secrets.AI_WORKFLOWS_PAT }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
            echo "mode=app" >> "$GITHUB_OUTPUT"
            echo "Resolved auth: GitHub App installation token (can push workflow-file changes)"
          elif [ -n "$PAT" ]; then
            echo "token=$PAT" >> "$GITHUB_OUTPUT"
            echo "mode=pat" >> "$GITHUB_OUTPUT"
            echo "Resolved auth: AI_WORKFLOWS_PAT (can push workflow-file changes)"
          else
            echo "mode=no-credentials" >> "$GITHUB_OUTPUT"
            echo "::warning::No push credential available (GitHub App secrets AI_WORKFLOWS_APP_ID/AI_WORKFLOWS_APP_PRIVATE_KEY unset and AI_WORKFLOWS_PAT unset) - the dogfood-bump job computes the pin bump + re-render locally but CANNOT push the result. The commit modifies .github/workflows/self-*.yml, which the GITHUB_TOKEN is policy-restricted from pushing (no `permissions:` key overrides this). Set the app secrets (preferred - no rotation) or AI_WORKFLOWS_PAT and re-run, or apply the bump manually as in PR #20."
          fi

      - name: Checkout ai-workflows (self)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            # refs/tags/v0.2.5 -> v0.2.5
            v="${GITHUB_REF##*/}"
          fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $v"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'

      - name: Build ai-sync
        run: go build -o /tmp/ai-sync ./scripts/ai-sync

      - name: Bump dogfood pins
        # Bump all v0.x.x tokens in the dogfood pin sites to the new version.
        # tests/workflows/pin_consistency_test.go::TestDogfoodPinsAreConsistent
        # guards that these stay in lockstep, so a partial bump fails CI.
        run: |
          set -euo pipefail
          NEW_TAG="${{ steps.ver.outputs.v }}"
          for f in \
            consumers/ai-workflows.yaml \
            .github/workflows/self-pr-review.yml \
            .github/workflows/self-ai-comment.yml \
            .github/workflows/self-renovate-analysis.yml; do
            # Replace every vX.Y.Z token in the file with the new tag. These
            # files contain only version tokens for THIS repo's dogfood pin
            # (no unrelated vX.Y.Z strings), so a global replace is safe.
            sed -i "s|v[0-9]\+\.[0-9]\+\.[0-9]\+|${NEW_TAG}|g" "$f"
          done
          echo "Bumped dogfood pins to ${NEW_TAG}."

      - name: Regenerate rendered prompts
        # The ai-sync renderer injects a "Managed by lenaxia/ai-workflows@vX.Y.Z"
        # banner from the consumer's version field. Re-render so the banner
        # matches the new tag. tests/workflows/prompt_invariants_test.go::
        # TestRenderedPromptsMatchTemplates guards byte-equality.
        run: |
          set -euo pipefail
          /tmp/ai-sync render \
            --consumer ai-workflows \
            --into .github/prompts \
            --repo-root .

      - name: Verify tests still pass
        # Belt-and-suspenders: don't open a PR with a broken pin/render state.
        # TestDogfoodPinsAreConsistent + TestRenderedPromptsMatchTemplates both
        # run here; if they fail, the PR step below is skipped via if:.
        id: tests
        continue-on-error: true
        run: go test ./tests/workflows/...

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open dogfood-bump PR
        # Only runs when a Workflows-granted credential is available (App
        # token or PAT): the commit modifies .github/workflows/self-*.yml,
        # which the GITHUB_TOKEN is policy-restricted from pushing (no
        # `permissions:` key overrides this).
        if: (steps.auth.outputs.mode == 'app' || steps.auth.outputs.mode == 'pat') && steps.changes.outputs.changed == 'true' && steps.tests.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          NEW_TAG: ${{ steps.ver.outputs.v }}
        run: |
          set -euo pipefail
          # Configure git to push as the PAT-bearing identity (the default
          # checkout credential helper uses GITHUB_TOKEN, which the push
          # step would reject for the workflow-file policy).
          git config --global --replace-all \
            url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          BRANCH="sync/dogfood-pins-${NEW_TAG}"
          git checkout -b "$BRANCH"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): bump dogfood pins to ${NEW_TAG}

          Auto-generated by propagate.yml (dogfood-bump job) on tag ${NEW_TAG}.
          Catches this repo's own dogfood pin sites up to ${NEW_TAG} in lockstep
          and regenerates the rendered-prompt banners so
          TestRenderedPromptsMatchTemplates stays green.

          Guarded by TestDogfoodPinsAreConsistent."
          git push --force-with-lease origin "$BRANCH"
          gh pr create \
            --title "chore(release): bump dogfood pins to ${NEW_TAG}" \
            --body "Auto-generated by \`propagate.yml\` (dogfood-bump job) on tag \`${NEW_TAG}\`.

          Bumps the dogfood pin sites in lockstep (guarded by \`TestDogfoodPinsAreConsistent\`):
          - \`consumers/ai-workflows.yaml\`
          - \`.github/workflows/self-pr-review.yml\`
          - \`.github/workflows/self-ai-comment.yml\`
          - \`.github/workflows/self-renovate-analysis.yml\`

          Regenerates the ai-sync-rendered prompt banners so \`TestRenderedPromptsMatchTemplates\` stays green.

          This job exists because \`propagate.yml\`'s consumer matrix handles OTHER repos but historically did not bump THIS repo's own dogfood pins - leaving them stuck at v0.2.1 across v0.2.2/v0.2.3 (PR #20 caught them up manually; this job prevents the next drift)." \
            --base main \
            --head "$BRANCH" || \
          gh pr edit "$BRANCH" --body "Updated dogfood-bump to ${NEW_TAG} (re-targeted existing PR)."

      - name: Skip dogfood-bump PR (no push token)
        # Graceful degradation: without a Workflows-granted credential the
        # bump is computed (the Bump dogfood pins + Regenerate rendered
        # prompts steps above ran and their diff is visible in the run log
        # via the Detect changes step) but NOT pushed. The operator applies
        # it manually (the exact manual process is documented in PR #20) or
        # sets the app secrets / PAT and re-runs.
        if: steps.auth.outputs.mode != 'app' && steps.auth.outputs.mode != 'pat' && steps.changes.outputs.changed == 'true' && steps.tests.outcome == 'success'
        env:
          NEW_TAG: ${{ steps.ver.outputs.v }}
        run: |
          echo "::warning::AI_WORKFLOWS_PAT is not set - computed the ${NEW_TAG} dogfood-bump (see the Bump dogfood pins + Regenerate rendered prompts step diffs above) but CANNOT push it. The commit modifies .github/workflows/self-*.yml, which the GITHUB_TOKEN is policy-restricted from pushing (no permissions: key overrides this). Set AI_WORKFLOWS_PAT (PAT with repo + workflow scope) and re-run, or apply the bump manually (see PR #20 for the exact process: sed + ai-sync render + commit + push + PR)."

      - name: Warn on test failure
        if: steps.changes.outputs.changed == 'true' && steps.tests.outcome != 'success'
        run: |
          echo "::warning::go test ./tests/workflows/... failed after the pin bump + re-render. Skipping the dogfood-bump PR so a broken state is not proposed for merge. Inspect the Verify tests still pass step above."

  # propagate handles the OTHER repos (the consumer matrix).
  propagate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        consumer: [gokore, llmsafespaces, rathena-client, tinyrsvp, containers, talos-ops-prod, synology-to-immich, ha-custom-components, ai-or-not, k8s-mechanic]
    steps:
      - name: Resolve target consumer
        id: target
        run: |
          if [ -n "${{ github.event.inputs.consumer }}" ]; then
            echo "name=${{ github.event.inputs.consumer }}" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event.inputs.consumer }}" != "${{ matrix.consumer }}" ]; then
              echo "skipping (single-consumer dispatch)"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "name=${{ matrix.consumer }}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if not targeted
        if: steps.target.outputs.skip == 'true'
        run: echo "Skipping ${{ matrix.consumer }} - single-consumer dispatch."

      - name: Detect app credentials
        # Same probe as the dogfood-bump job: the secrets context is not
        # reliably usable in a step `if:`, so bash reads the app secrets
        # from env and gates the token-mint step below.
        if: steps.target.outputs.skip != 'true'
        id: appdetect
        env:
          APP_ID: ${{ secrets.AI_WORKFLOWS_APP_ID }}
          APP_KEY: ${{ secrets.AI_WORKFLOWS_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate app token
        # 1h installation token with Contents/PR/Workflows RW on every repo
        # the app is installed on (all consumers + this repo). Default
        # installation scope - no owner/repositories inputs - because the
        # consumer matrix needs different repos per leg.
        if: steps.target.outputs.skip != 'true' && steps.appdetect.outputs.has_app == 'true'
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AI_WORKFLOWS_APP_ID }}
          private-key: ${{ secrets.AI_WORKFLOWS_APP_PRIVATE_KEY }}

      - name: Resolve auth token
        # Cross-repo checkout + cross-repo PR both need a token with access
        # beyond this repo. Tier 1: GitHub App installation token (minted
        # above when the app secrets are set). Tier 2: AI_WORKFLOWS_PAT (a
        # PAT with repo + workflow scope). Tier 3: the default
        # GITHUB_TOKEN, which can read PUBLIC repos only and cannot open
        # cross-repo PRs. The PR steps below are gated on mode being
        # 'app' or 'pat'. Pre-this-fix, an empty AI_WORKFLOWS_PAT made
        # actions/checkout@v6 fail with a generic "Input required and not
        # supplied: token".
        id: auth
        if: steps.target.outputs.skip != 'true'
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          PAT: ${{ secrets.AI_WORKFLOWS_PAT }}
          GT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
            echo "mode=app" >> "$GITHUB_OUTPUT"
            echo "Resolved auth: GitHub App installation token (full cross-repo capability)"
          elif [ -n "$PAT" ]; then
            echo "token=$PAT" >> "$GITHUB_OUTPUT"
            echo "mode=pat" >> "$GITHUB_OUTPUT"
            echo "Resolved auth: AI_WORKFLOWS_PAT (full cross-repo capability)"
          else
            echo "token=$GT" >> "$GITHUB_OUTPUT"
            echo "mode=github-token-fallback" >> "$GITHUB_OUTPUT"
            echo "::warning::No cross-repo credential available (GitHub App secrets AI_WORKFLOWS_APP_ID/AI_WORKFLOWS_APP_PRIVATE_KEY unset and AI_WORKFLOWS_PAT unset) - falling back to GITHUB_TOKEN. Public consumers will check out and render, but the cross-repo sync PR will be SKIPPED (GITHUB_TOKEN can't open PRs in other repos). Private consumer (gokore) checkout will fail. Set the app secrets (preferred - no rotation) or AI_WORKFLOWS_PAT and re-run to enable full propagation."
          fi

      - name: Checkout ai-workflows
        if: steps.target.outputs.skip != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Resolve version
        if: steps.target.outputs.skip != 'true'
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "v=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # Use the pushed tag ref name (e.g. refs/tags/v0.2.0 -> v0.2.0)
            echo "v=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.target.outputs.skip != 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'

      - name: Build ai-sync
        if: steps.target.outputs.skip != 'true'
        run: go build -o /tmp/ai-sync ./scripts/ai-sync

      - name: Checkout consumer
        # Uses the resolved token (PAT if available, GITHUB_TOKEN otherwise).
        # For public consumers the GITHUB_TOKEN fallback is sufficient for
        # read access; for private consumer gokore, only the PAT works.
        # continue-on-error so a failed private-repo checkout (no PAT) does
        # not turn the whole matrix job red - the warning is emitted and the
        # downstream PR step is skipped via the checkout_ok gate.
        id: consumer_checkout
        if: steps.target.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: lenaxia/${{ matrix.consumer }}
          token: ${{ steps.auth.outputs.token }}
          path: consumer

      - name: Record checkout status
        if: steps.target.outputs.skip != 'true'
        id: co
        run: |
          if [ "${{ steps.consumer_checkout.outcome }}" = "success" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Checkout of ${{ matrix.consumer }} failed (likely private repo without AI_WORKFLOWS_PAT, or token has insufficient scope). Skipping render/bump/PR for this consumer."
          fi

      - name: Render into consumer
        if: steps.target.outputs.skip != 'true' && steps.co.outputs.ok == 'true'
        run: |
          /tmp/ai-sync render \
            --consumer ${{ matrix.consumer }} \
            --into consumer/.github/prompts \
            --repo-root .

      - name: Bump tag in consumer workflow files
        # The uses: ref is a hardcoded literal (GitHub doesn't allow vars
        # context in uses:). Bump it via sed so the consumer's workflows
        # point at the new tag. Also bump the version: input to match.
        #
        # OLD_TAG discovery is now robust against consumers that lack
        # ai-comment.yml: grep the first available workflow file in a fixed
        # order and extract the existing pin from there.
        if: steps.target.outputs.skip != 'true' && steps.co.outputs.ok == 'true'
        working-directory: consumer
        run: |
          set -euo pipefail
          NEW_TAG="${{ steps.ver.outputs.v }}"
          OLD_TAG=""
          for wf in .github/workflows/ai-comment.yml .github/workflows/pr-review.yml .github/workflows/issue-opened.yml .github/workflows/renovate-analysis.yml; do
            [ -f "$wf" ] || continue
            # Match either a SHA pin (40 hex) or a vX.Y.Z tag pin after '@'.
            OLD_TAG="$(grep -oP 'ai-workflows/.github/workflows/\w+\.yml@\K([0-9a-f]{40}|v[0-9]+\.[0-9]+\.[0-9]+)' "$wf" 2>/dev/null | head -1 || true)"
            [ -n "$OLD_TAG" ] && break
          done
          echo "Bumping ${OLD_TAG:-<none>} -> ${NEW_TAG} in ${{ matrix.consumer }}"
          for wf in .github/workflows/ai-comment.yml .github/workflows/issue-opened.yml .github/workflows/pr-review.yml .github/workflows/renovate-analysis.yml; do
            [ -f "$wf" ] || continue
            if [ -n "$OLD_TAG" ]; then
              sed -i "s|@${OLD_TAG}|@${NEW_TAG}|g" "$wf"
              sed -i "s|version: ${OLD_TAG}|version: ${NEW_TAG}|g" "$wf"
            fi
          done
          # Record the pin for auditability
          cat > ai-workflows.config.yml <<EOF
          version: ${{ steps.ver.outputs.v }}
          source: lenaxia/ai-workflows
          EOF

      - name: Detect changes
        if: steps.target.outputs.skip != 'true' && steps.co.outputs.ok == 'true'
        id: changes
        working-directory: consumer
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve default branch
        # Don't assume every consumer's default branch is `main`. Ask the API.
        if: steps.target.outputs.skip != 'true' && steps.co.outputs.ok == 'true' && steps.changes.outputs.changed == 'true'
        id: base
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          DEFAULT_BRANCH="$(gh api repos/lenaxia/${{ matrix.consumer }} --jq '.default_branch')"
          echo "branch=${DEFAULT_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Consumer ${{ matrix.consumer }} default branch: ${DEFAULT_BRANCH}"

      - name: Open sync PR
        # Cross-repo PRs require a credential beyond this repo: the GitHub
        # App token or the PAT. GITHUB_TOKEN cannot open PRs in other repos
        # even if they're public. When neither tier-1/2 credential is set we
        # skip with a visible warning rather than failing - the render/diff
        # above still ran (for public consumers), so an operator can see
        # what WOULD have been proposed.
        if: steps.target.outputs.skip != 'true' && steps.co.outputs.ok == 'true' && steps.changes.outputs.changed == 'true' && (steps.auth.outputs.mode == 'app' || steps.auth.outputs.mode == 'pat')
        working-directory: consumer
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          BRANCH="sync/ai-workflows-${{ steps.ver.outputs.v }}"
          git checkout -b "$BRANCH"
          git config user.name "ai-workflows-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "chore(ai): sync to ai-workflows@${{ steps.ver.outputs.v }}"
          git push --force-with-lease origin "$BRANCH"
          gh pr create \
            --title "chore(ai): sync to ai-workflows@${{ steps.ver.outputs.v }}" \
            --body "Automated sync from lenaxia/ai-workflows@${{ steps.ver.outputs.v }}.

          This PR includes:
          - Rendered prompt files (if any templates changed)
          - Bumped \`@<tag>\` and \`version:\` in the AI workflow files

          Review the diff. Merge to accept; close to skip this version.

          To roll back, revert this PR - both prompts and the pin revert together." \
            --base "${{ steps.base.outputs.branch }}" \
            --head "$BRANCH" || \
          gh pr edit "$BRANCH" --body "Updated sync to ai-workflows@${{ steps.ver.outputs.v }} (re-targeted existing PR)."

      - name: Skip sync PR (no cross-repo token)
        if: steps.target.outputs.skip != 'true' && steps.co.outputs.ok == 'true' && steps.changes.outputs.changed == 'true' && steps.auth.outputs.mode != 'app' && steps.auth.outputs.mode != 'pat'
        run: |
          echo "::warning::Cannot open a cross-repo sync PR in ${{ matrix.consumer }} without a cross-repo credential (GitHub App secrets AI_WORKFLOWS_APP_ID/AI_WORKFLOWS_APP_PRIVATE_KEY, or AI_WORKFLOWS_PAT - GITHUB_TOKEN can't open PRs in other repos). The rendered/bumped changes were computed in the runner workspace (see the Render into consumer and Bump tag steps above) but were NOT pushed. Set the app secrets (preferred - no rotation) or AI_WORKFLOWS_PAT and re-run this workflow to deliver ${{ steps.ver.outputs.v }} to ${{ matrix.consumer }}."

      - name: Update AI_WORKFLOWS_PIN variable (audit record)
        # The functional pin is the hardcoded @<tag> in the workflow files
        # (bumped above). This variable is kept as an audit/lookup record only
        # - it is not read by any workflow's uses: ref.
        # Skipped without a tier-1/2 credential: setting a repo variable on
        # another repo needs admin-level access; the step itself is tolerant
        # (|| true) if the credential lacks it.
        if: steps.target.outputs.skip != 'true' && steps.co.outputs.ok == 'true' && steps.changes.outputs.changed == 'true' && (steps.auth.outputs.mode == 'app' || steps.auth.outputs.mode == 'pat')
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          gh api -X DELETE repos/lenaxia/${{ matrix.consumer }}/actions/variables/AI_WORKFLOWS_PIN 2>/dev/null || true
          gh api repos/lenaxia/${{ matrix.consumer }}/actions/variables \
            -f name=AI_WORKFLOWS_PIN \
            -f value="${{ steps.ver.outputs.v }}" 2>/dev/null || true
