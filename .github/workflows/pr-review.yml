# PR Review (reusable) — runs the AI reviewer on newly-opened or updated PRs.
#
# Caller contract (consumer's .github/workflows/pr-review.yml):
#
#   name: PR Review
#   on:
#     pull_request: { types: [opened, synchronize] }
#   permissions:                          # REQUIRED — see README Lessons Learned #2
#     id-token: write
#     contents: read
#     issues: write
#     pull-requests: write
#   jobs:
#     review:
#       uses: lenaxia/ai-workflows/.github/workflows/pr-review.yml@v0.2.0
#       secrets: inherit
#       with:
#         version: v0.2.0
#         project_name: myrepo
#         runs_on: ubuntu-latest    # optional; self-hosted consumers pass their label
#
# The `uses:` ref MUST be a hardcoded tag (no vars context — see README
# Lessons Learned #1). The reusable workflow at v0.2.9+ skips automation
# bots (renovate, github-actions, release-please, dependabot, mergify,
# github-merge-queue) at the job level, so callers do NOT need to add
# their own `if:` filter for those — add one only for custom bots.
# `runs_on` defaults to ubuntu-latest; self-hosted consumers (e.g. gokore)
# pass their own runner label so AI jobs don't silently move to GitHub-hosted runners.

name: PR Review (reusable)

on:
  workflow_call:
    inputs:
      version:
        description: "ai-workflows tag or sha to source scripts from"
        type: string
        required: true
      project_name:
        description: "Consumer project name (injected into prompt context)"
        type: string
        required: true
      runs_on:
        description: "Runner label(s) for the job (default ubuntu-latest). Self-hosted consumers pass their own label."
        type: string
        required: false
        default: ubuntu-latest

jobs:
  review:
    runs-on: ${{ inputs.runs_on }}
    # Skip automation-bot PRs. Reason: the opencode CLI's assertPermissions()
    # runs a collaborator-permission check that returns 'none' for bot
    # accounts (they are not collaborators), causing the workflow to fail
    # before the AI can review. Bot PRs are typically auto-generated
    # (release-please version bumps, dependabot dependency updates) and
    # either trivial or out-of-scope for code review. To review a specific
    # bot PR, the maintainer can dispatch the workflow manually.
    #
    # To extend this list for your org's other bots, copy this `if:` block
    # into your caller workflow's job and add the bot username.
    if: ${{ !contains(fromJson('["renovate[bot]","github-actions[bot]","release-please[bot]","dependabot[bot]","mergify[bot]","github-merge-queue[bot]"]'), github.event.pull_request.user.login) }}
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          # persist-credentials: true — REQUIRED even though this workflow
          # never pushes code. The opencode action runs
          # `git fetch origin --depth=20 <PR branch>` at STARTUP, before any
          # review work; on PRIVATE consumers (gokore) an anonymous fetch
          # fails with `could not read Username` (exit 128) and the run dies
          # before the LLM ever executes (the v0.2.2–v0.2.10 regression —
          # every gokore `review / review` red; public consumers were immune
          # because anonymous reads are allowed there). The persisted
          # credential is safe: the job token is scoped contents: read, so
          # opencode's end-of-run snapshot push still fails — the tolerated
          # failure the Verify step below was built for. Reviews-only is
          # enforced by token scope, not by removing the credential.
          persist-credentials: true

      - name: Checkout ai-workflows (pinned)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: lenaxia/ai-workflows
          ref: ${{ inputs.version }}
          path: .ai-workflows
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep ai-workflows out of consumer git index
        # The pinned ai-workflows checkout above lives INSIDE the consumer
        # worktree — actions/checkout@v6 requires `path` to be under
        # $GITHUB_WORKSPACE (it throws `Repository path '...' is not under
        # the GITHUB_WORKSPACE` otherwise), so we cannot use
        # ${{ runner.temp }}/ai-workflows. Because that nested checkout
        # carries its own .git, opencode's end-of-run `git add -A` would
        # otherwise sweep it into the consumer index as a gitlink (a
        # submodule reference with no .gitmodules entry), and
        # actions/checkout's post-job cleanup would then emit
        # `fatal: No url found for submodule path '.ai-workflows' in
        # .gitmodules`. Recording it in .git/info/exclude (local to this
        # checkout, never committed) keeps the scripts readable from disk
        # while keeping the directory out of the consumer's git index. See
        # issue #17 (Bug B).
        run: printf '.ai-workflows/\n' >> .git/info/exclude

      - name: Configure git identity
        # Self-hosted ubuntu runners in this org don't ship a default git
        # user.name/user.email, so `git commit` from the OpenCode step fails
        # with "empty ident name ... not allowed" whenever the AI creates a
        # branch/PR. Set an explicit identity (GitHub's canonical bot no-reply).
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build prompt
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          {
            echo "OPENCODE_PROMPT<<__PROMPT_EOF__"
            cat .github/prompts/context.md
            printf '\n\n---\n\n'
            cat .github/prompts/core-rules.md
            printf '\n\n---\n\n'
            cat .github/prompts/pr-review.md
            printf '\n\n**Commit under review (headRefOid):** `%s`\nRecord this exact SHA in the `**Commit reviewed:**` line at the top of your review body.\n' "$PR_HEAD_SHA"
            printf '\n\nA new pull request has been opened. Perform a thorough review and submit it as a formal GitHub pull request review via `gh pr review` (APPROVE only if there are zero findings; otherwise REQUEST_CHANGES, which is blocking). Never post the verdict as a plain PR comment and never use a COMMENT-only review.\n'
            echo "__PROMPT_EOF__"
          } >> "$GITHUB_ENV"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@0cf0294787322664c6d668fa5ab0a9ce26796f78 # github-v1.2.9
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: openai-compatible/default
          use_github_token: "true"
          share: "false"
          prompt: ${{ env.OPENCODE_PROMPT }}
        # opencode unconditionally runs a `git push` at end-of-run to persist
        # its session/snapshot branch. The consumer checkout persists a
        # contents: read credential (required for the startup branch fetch on
        # private consumers — see the checkout step above), so this push dies
        # with HTTP 403 and opencode exits 1 — marking the job FAILED even
        # though the review itself was posted successfully via
        # `gh pr review`. The verify step below is the source of truth for
        # the job conclusion; we tolerate opencode's exit status here so the
        # snapshot-push failure stops poisoning every approved PR's required
        # check. See issue #17 (Bug A).
        continue-on-error: true

      - name: Check verdict delivered
        # First-pass gate: was a verdict (APPROVED or CHANGES_REQUESTED) by
        # github-actions[bot] recorded against this PR's HEAD commit? Sets the
        # `delivered` output for the salvage/retry steps below; the FINAL
        # gate (Verify review submitted) is the job's source of truth.
        id: check-verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # --paginate + per-page count aggregation: /pulls/N/reviews pages at
          # 30, oldest first, so a busy PR with >30 reviews (or >30 stale
          # reviews from prior commits) would hide the head-SHA verdict on a
          # later page and false-negative here.
          count="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]") | select((.state == "APPROVED" or .state == "CHANGES_REQUESTED") and .commit_id == "'"${PR_HEAD_SHA}"'")] | length' \
            | awk '{s+=$1} END {print s+0}')"
          if [ "${count}" -gt 0 ]; then
            echo "delivered=true" >> "${GITHUB_OUTPUT}"
            echo "Found ${count} bot review(s) against HEAD ${PR_HEAD_SHA} on PR #${PR_NUMBER} — verdict delivered."
          else
            echo "delivered=false" >> "${GITHUB_OUTPUT}"
            echo "No bot verdict against HEAD ${PR_HEAD_SHA} on PR #${PR_NUMBER} — attempting salvage/retry."
          fi

      - name: Salvage dumped verdict
        id: salvage
        # When opencode ran but its verdict landed as a plain issue comment
        # instead of an official review (the historical posting-failure
        # class — PRs like LLMSafeSpaces#870 produced ~24 dumped verdicts),
        # recover the review-shaped comment body (## Code Review + ###
        # Verdict) into an OFFICIAL review pinned to the head SHA. The
        # verdict is derived from the comment's ### Verdict section so the
        # review carries the correct event (APPROVED/CHANGES_REQUESTED);
        # unparseable verdicts and stale-SHA comments are NOT salvaged
        # (posting a COMMENT-only review would not satisfy the final gate and
        # would only add noise). Logic lives in scripts/salvage-verdict.sh
        # (unit-tested in tests/gharouter).
        #
        # continue-on-error: a transient failure here (the GitHub API blip
        # class the retry exists for) must NOT stop the job — the retry step
        # below runs when salvaged != 'true' (the script emits salvaged=false
        # up-front, so an unset output from a crashed step also proceeds).
        continue-on-error: true
        if: always() && steps.check-verdict.outputs.delivered == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .ai-workflows/scripts/salvage-verdict.sh

      - name: Run OpenCode (bounded retry)
        # One retry of the LLM review when neither the first run nor the
        # salvage produced a verdict (transient model/API failures — e.g. a
        # provider 429 or a GitHub API blip killing the permission check).
        # Bounded to exactly one extra attempt; if this also fails to
        # deliver, a final salvage pass runs, then the verify gate fails the
        # job visibly.
        #
        # Condition: delivered == 'false' AND salvage did not succeed.
        # `!= 'true'` (rather than `== 'false'`) tolerates the unset output
        # from a salvage step that crashed on a transient API failure, while
        # the delivered=='false' guard still skips this when the verdict
        # already landed (so a skipped/never-run salvage cannot re-run the
        # LLM unnecessarily).
        if: always() && steps.check-verdict.outputs.delivered == 'false' && steps.salvage.outputs.salvaged != 'true'
        uses: anomalyco/opencode/github@0cf0294787322664c6d668fa5ab0a9ce26796f78 # github-v1.2.9
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: openai-compatible/default
          use_github_token: "true"
          share: "false"
          prompt: ${{ env.OPENCODE_PROMPT }}
        continue-on-error: true

      - name: Salvage dumped verdict (after retry)
        # The retry run can itself dump a review-shaped comment instead of
        # creating an official review (the same failure class as the first
        # run). Re-run salvage against the post-retry comment stream so the
        # retry's verdict is not wasted.
        #
        # Gated on salvaged != 'true' as well: when the FIRST salvage
        # succeeded, posting an official review does not remove the dumped
        # comment, so an ungated run here would POST A DUPLICATE review.
        id: salvage-retry
        continue-on-error: true
        if: always() && steps.check-verdict.outputs.delivered == 'false' && steps.salvage.outputs.salvaged != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .ai-workflows/scripts/salvage-verdict.sh

      - name: Verify review submitted
        # Source of truth for the job's pass/fail: was a verdict (APPROVED or
        # CHANGES_REQUESTED) by github-actions[bot] recorded against this PR's
        # HEAD commit? If opencode crashed before delivering a verdict AND the
        # salvage step had nothing to recover, this step fails the job even
        # though the Run OpenCode steps' own exit status was masked via
        # continue-on-error above. Conversely, if the verdict was posted
        # (directly, salvaged, or retried) and opencode then died on its
        # end-of-run push, this step passes — the correct outcome: the review
        # IS the deliverable, and it landed.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # --paginate + per-page count aggregation (see Check verdict
          # delivered): a busy PR's head-SHA verdict can sit beyond page 1.
          count="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]") | select((.state == "APPROVED" or .state == "CHANGES_REQUESTED") and .commit_id == "'"${PR_HEAD_SHA}"'")] | length' \
            | awk '{s+=$1} END {print s+0}')"
          if [ "${count}" -eq 0 ]; then
            echo "ERROR: no APPROVED/CHANGES_REQUESTED review by github-actions[bot] against HEAD ${PR_HEAD_SHA} found on PR #${PR_NUMBER}." >&2
            echo "The opencode run did not deliver a verdict (attempts: 1 run + 1 salvage + 1 retry). Failing the job." >&2
            exit 1
          fi
          echo "Found ${count} bot review(s) against HEAD ${PR_HEAD_SHA} on PR #${PR_NUMBER} — verdict delivered."

      - name: Post AI command reference (once per thread)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.pull_request.number }}
          PROMPTS_DIR: .github/prompts
        run: .ai-workflows/scripts/post-footer.sh
