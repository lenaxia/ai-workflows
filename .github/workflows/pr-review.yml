# PR Review (reusable) — runs the AI reviewer on newly-opened or updated PRs.
#
# Caller contract (consumer's .github/workflows/pr-review.yml):
#
#   name: PR Review
#   on:
#     pull_request: { types: [opened, synchronize] }
#   permissions:                          # REQUIRED — see README Lessons Learned #2
#     id-token: write
#     contents: read
#     issues: write
#     pull-requests: write
#   jobs:
#     review:
#       uses: lenaxia/ai-workflows/.github/workflows/pr-review.yml@v0.2.0
#       secrets: inherit
#       with:
#         version: v0.2.0
#         project_name: myrepo
#         runs_on: ubuntu-latest    # optional; self-hosted consumers pass their label
#
# The `uses:` ref MUST be a hardcoded tag (no vars context — see README
# Lessons Learned #1). The reusable workflow at v0.2.9+ skips automation
# bots (renovate, github-actions, release-please, dependabot, mergify,
# github-merge-queue) at the job level, so callers do NOT need to add their
# own `if:` filter for those — add one only for custom bots. This repo's
# own ai-workflows-propagation[bot] is additionally TRUSTED BY DEFAULT
# (scripts/default-trusted-bots.sh): its sync PRs are always reviewable,
# with no caller wiring.
# `runs_on` defaults to ubuntu-latest; self-hosted consumers (e.g. gokore)
# pass their own runner label so AI jobs don't silently move to GitHub-hosted runners.
#
# VERDICT-DELIVERY IDENTITY MATRIX (issue #46 / PR #49; full table in README
# Lessons Learned #10). The verdict is ALWAYS submitted by github-actions[bot]
# (GITHUB_TOKEN mode via USE_GITHUB_TOKEN; the RELEASED CLI never reads a
# TOKEN env — the self-hosted patched CLI at scripts/opencode-cli/ honors it
# solely as the trusted-bot assert bypass, never as API auth). Delivery is
# two-channel, gated by
# scripts/check-verdict.sh: an official bot review pinned to the head SHA, OR
# a bot comment carrying <!-- ai-workflows-verdict: <EVENT> sha=<head> -->
# (the REQUIRED fallback when GitHub refuses the review event itself, e.g.
# 422 "GitHub Actions is not permitted to approve pull requests"). Red
# failure is reserved for "neither channel could post". PR authors who are
# not collaborators (app bots, outside contributors) are stopped by a
# pre-flight (scripts/author-permission.sh — same permission source as the
# CLI's assertPermissions) with an explanatory comment, because the CLI's
# unconditional assert would otherwise kill each LLM attempt pre-review.

name: PR Review (reusable)

on:
  workflow_call:
    inputs:
      version:
        description: "ai-workflows tag or sha to source scripts from"
        type: string
        required: true
      project_name:
        description: "Consumer project name (injected into prompt context)"
        type: string
        required: true
      runs_on:
        description: "Runner label(s) for the job (default ubuntu-latest). Self-hosted consumers pass their own label."
        type: string
        required: false
        default: ubuntu-latest
      trusted_app_bots:
        description: "JSON array of exact app-bot logins (e.g. [\"my-app[bot]\"]) admitted past the opencode startup permission assert. App bots can never be collaborators (getCollaboratorPermissionLevel returns 'none' for them), so without this entry every PR they author is refused pre-LLM — EXCEPT ai-workflows-propagation[bot], always trusted (this pipeline's own propagation bot; see scripts/default-trusted-bots.sh). Listed actors run in TOKEN mode; all other actors still pass the collaborator assert. Each entry is a deliberate trust decision — never wildcards, never human logins."
        type: string
        required: false
        default: "[]"

jobs:
  review:
    runs-on: ${{ inputs.runs_on }}
    # Skip automation-bot PRs. Reason: the opencode CLI's assertPermissions()
    # runs a collaborator-permission check that returns 'none' for bot
    # accounts (they are not collaborators), causing the workflow to fail
    # before the AI can review. Bot PRs are typically auto-generated
    # (release-please version bumps, dependabot dependency updates) and
    # either trivial or out-of-scope for code review. To review a specific
    # bot PR, the maintainer can dispatch the workflow manually.
    #
    # EXCEPTION (#59): a bot listed in the caller's trusted_app_bots input is
    # NEVER skipped — that list is a deliberate per-bot trust decision, and
    # the authmode step + patched CLI (TOKEN-mode assert bypass) handle it
    # end to end. Skipping here would make trusted_app_bots unreachable from
    # job-level (the exact #59 defect: ai-workflows-propagation[bot] sat in
    # this array while every other layer admitted it).
    #
    # ai-workflows-propagation[bot] — THIS pipeline's own propagation bot —
    # is additionally admitted BY DEFAULT (scripts/default-trusted-bots.sh):
    # it authors every consumer sync PR and dogfood-bump PR, and requiring
    # each consumer to hand-wire it reproduced the chicken-and-egg the
    # trusted_app_bots input exists to end. Default-skipped bots that a repo
    # wants reviewed must be added to trusted_app_bots, not removed from
    # this array.
    #
    # To extend the default-skip list for your org's other bots, copy this
    # `if:` block into your caller workflow's job and add the bot username.
    if: ${{ !contains(fromJson('["renovate[bot]","github-actions[bot]","release-please[bot]","dependabot[bot]","mergify[bot]","github-merge-queue[bot]"]'), github.event.pull_request.user.login) || github.event.pull_request.user.login == 'ai-workflows-propagation[bot]' || contains(fromJson(inputs.trusted_app_bots), github.event.pull_request.user.login) }}
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          # persist-credentials: true — REQUIRED even though this workflow
          # never pushes code. The opencode action runs
          # `git fetch origin --depth=20 <PR branch>` at STARTUP, before any
          # review work; on PRIVATE consumers (gokore) an anonymous fetch
          # fails with `could not read Username` (exit 128) and the run dies
          # before the LLM ever executes (the v0.2.2–v0.2.10 regression —
          # every gokore `review / review` red; public consumers were immune
          # because anonymous reads are allowed there). The persisted
          # credential is safe: the job token is scoped contents: read, so
          # opencode's end-of-run snapshot push still fails — the tolerated
          # failure the Verify step below was built for. Reviews-only is
          # enforced by token scope, not by removing the credential.
          persist-credentials: true

      - name: Checkout ai-workflows (pinned)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: lenaxia/ai-workflows
          ref: ${{ inputs.version }}
          path: .ai-workflows
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep ai-workflows out of consumer git index
        # The pinned ai-workflows checkout above lives INSIDE the consumer
        # worktree — actions/checkout@v6 requires `path` to be under
        # $GITHUB_WORKSPACE (it throws `Repository path '...' is not under
        # the GITHUB_WORKSPACE` otherwise), so we cannot use
        # ${{ runner.temp }}/ai-workflows. Because that nested checkout
        # carries its own .git, opencode's end-of-run `git add -A` would
        # otherwise sweep it into the consumer index as a gitlink (a
        # submodule reference with no .gitmodules entry), and
        # actions/checkout's post-job cleanup would then emit
        # `fatal: No url found for submodule path '.ai-workflows' in
        # .gitmodules`. Recording it in .git/info/exclude (local to this
        # checkout, never committed) keeps the scripts readable from disk
        # while keeping the directory out of the consumer's git index. See
        # issue #17 (Bug B).
        run: printf '.ai-workflows/\n' >> .git/info/exclude

      - name: Configure git identity
        # Self-hosted ubuntu runners in this org don't ship a default git
        # user.name/user.email, so `git commit` from the OpenCode step fails
        # with "empty ident name ... not allowed" whenever the AI creates a
        # branch/PR. Set an explicit identity (GitHub's canonical bot no-reply).
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve opencode auth (trusted app bots)
        # App-bot PR authors structurally return 'none' from the collaborator
        # check (apps are not collaborators), so the CLI assert refuses them
        # before the LLM starts — even when the app holds contents:write via
        # its installation. Two distinct env vars, often conflated:
        # USE_GITHUB_TOKEN selects GITHUB_TOKEN auth mode in the live CLI
        # handler (normalizeUseGithubToken reads it — it is the mode switch
        # every Run OpenCode step sets); TOKEN is the assert-bypass trust
        # marker, honored ONLY by the self-hosted patched build
        # (scripts/opencode-cli/0001; the released CLI never reads it).
        # When the PR author is on the caller's trusted_app_bots list, this
        # step exports TOKEN=<job token> so the assert is bypassed FOR THAT
        # ACTOR ONLY; otherwise the output is empty (falsy in JS) and the
        # assert keeps enforcing. Fail-closed on malformed list JSON. Trust
        # decision stays caller-owned: this input is the ONLY way a bot gets in.
        id: authmode
        env:
          ACTOR: ${{ github.event.pull_request.user.login }}
          TRUSTED_APP_BOTS: ${{ inputs.trusted_app_bots }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .ai-workflows/scripts/trusted-bot-auth.sh

      - name: Pre-flight author permission
        # `opencode github run` treats pull_request as a USER event and runs
        # assertPermissions() unconditionally: getCollaboratorPermissionLevel
        # (owner, repo, username: <PR author>) must return admin|write or the
        # run dies BEFORE the LLM starts (~23s) — and the bounded retry dies
        # identically. App-bot authors (not collaborators → 'none') and
        # outside contributors always hit this. The pre-flight queries the
        # SAME endpoint with the SAME pass-set (the same-source contract,
        # owner ruling #6209918061 point 3) and fails OPEN on API errors, so
        # the CLI assert remains the sole enforcement; its only job is to
        # skip LLM attempts that are structurally doomed and leave a
        # PR-visible explanation instead of a bare "no verdict delivered".
        # EXCEPTION (same-source-preserving): authors on the caller's
        # trusted_app_bots list are admitted because the CLI assert is
        # bypassed for them via TOKEN mode (authmode step above) — the run
        # is NOT doomed; refusing here would re-create the gap this input
        # exists to close.
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          TRUSTED_APP_BOTS: ${{ inputs.trusted_app_bots }}
        run: .ai-workflows/scripts/author-permission.sh

      - name: Report unreviewable author
        # The blocked cell of the identity matrix: no review outcome exists
        # (the CLI refuses to run), so the honest outcome is a loud red plus
        # a PR-visible explanation with the recovery path. The comment body
        # deliberately avoids the review-shaped headers so salvage-verdict.sh
        # can never mistake it for a dumped verdict.
        if: always() && steps.preflight.outputs.author_allowed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          gh pr comment "${PR_NUMBER}" --repo "${REPOSITORY}" --body \
            "⚠️ Automated review could not run: PR author @${PR_AUTHOR} is not a repository collaborator, and the reviewer's startup permission assert (which checks the PR author for pull_request events) refuses non-collaborators before any review pass. To get this PR reviewed, a member with write access can post \`/review\` on this thread (the comment path checks the commenter instead), or — if @${PR_AUTHOR} is a trusted app bot — add its exact login to the caller's \`trusted_app_bots\` input (app bots can never be collaborators; the input bypasses the assert for listed bots only). Job will be marked failed so the gap stays visible."

      - name: Build prompt
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          {
            echo "OPENCODE_PROMPT<<__PROMPT_EOF__"
            cat .github/prompts/context.md
            printf '\n\n---\n\n'
            cat .github/prompts/core-rules.md
            printf '\n\n---\n\n'
            cat .github/prompts/pr-review.md
            printf '\n\n**Commit under review (headRefOid):** `%s`\nRecord this exact SHA in the `**Commit reviewed:**` line at the top of your review body.\n' "$PR_HEAD_SHA"
            printf '\n\nA new pull request has been opened. Perform a thorough review and submit it as a formal GitHub pull request review via `gh pr review` (APPROVE only if there are zero findings; otherwise REQUEST_CHANGES, which is blocking). Never use a COMMENT-only review.\n'
            printf '\nVerdict-delivery contract (overrides any conflicting instruction in the prompts above): FIRST always try to submit the verdict as a formal review event against the recorded head SHA. If GitHub refuses the review submission itself — HTTP 422 / "GitHub Actions is not permitted to approve pull requests" / any "not permitted" refusal on the SUBMIT call (not on reads) — you MUST still deliver the complete review: post it as ONE ordinary PR comment whose first line is exactly `<!-- ai-workflows-verdict: APPROVE sha=<full head SHA copied from the prompt> -->` (or REQUEST_CHANGES instead of APPROVE), followed by the full review body in the required format (**Commit reviewed:** line, ## Code Review, all sections, ### Verdict). Never deliver nothing. Never submit a COMMENT-only review, a dishonest verdict, or a verdict pinned to any other SHA.\n'
            echo "__PROMPT_EOF__"
          } >> "$GITHUB_ENV"

      - name: Run OpenCode
        # Gated on the pre-flight (author is a collaborator — otherwise the
        # CLI's assertPermissions kills the run pre-LLM; see the pre-flight
        # step). `!= 'false'` (not `== 'true'`) keeps the fail-open contract:
        # an unset output from a crashed pre-flight proceeds exactly as the
        # pre-fix behavior, with the CLI assert still enforcing.
        #
        # Self-hosted patched CLI via .ai-workflows/scripts/opencode-cli/run.sh
        # (replaces anomalyco/opencode/github@<sha> — the released CLI's live
        # github handler refuses app-bot actors; see scripts/opencode-cli/).
        # Env contract mirrors the composite's inner step. The trusted-bot
        # TOKEN bypass rides GITHUB_ENV from the authmode step, which a plain
        # run step receives natively.
        if: steps.preflight.outputs.author_allowed != 'false'
        env:
          MODEL: openai-compatible/default
          AGENT: ""
          SHARE: "false"
          PROMPT: ${{ env.OPENCODE_PROMPT }}
          USE_GITHUB_TOKEN: "true"
          MENTIONS: ""
          VARIANT: ""
          OIDC_BASE_URL: ""
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .ai-workflows/scripts/opencode-cli/run.sh
        # opencode unconditionally runs a `git push` at end-of-run to persist
        # its session/snapshot branch. The consumer checkout persists a
        # contents: read credential (required for the startup branch fetch on
        # private consumers — see the checkout step above), so this push dies
        # with HTTP 403 and opencode exits 1 — marking the job FAILED even
        # though the review itself was posted successfully via
        # `gh pr review`. The verify step below is the source of truth for
        # the job conclusion; we tolerate opencode's exit status here so the
        # snapshot-push failure stops poisoning every approved PR's required
        # check. See issue #17 (Bug A).
        continue-on-error: true

      - name: Check verdict delivered
        # First-pass gate: was a verdict delivered against this PR's HEAD
        # commit through EITHER channel? Sets `delivered` (review|comment|
        # false) for the salvage/retry steps below; the FINAL gate (Verify
        # review submitted) is the job's source of truth. Two-channel logic
        # (official bot review OR sha-pinned verdict-marker comment — the
        # issue-#46 approve-blocked fallback) lives in scripts/check-verdict.sh
        # so this step, the verify gate and the /review tail of ai-comment.yml
        # all decide identically.
        #
        # continue-on-error: a transient API blip here must not stop the job —
        # the step's output is then unset, salvage still runs (`!= 'review'`
        # tolerates unset), and the verify gate re-runs the script fresh.
        id: check-verdict
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .ai-workflows/scripts/check-verdict.sh

      - name: Salvage dumped verdict
        id: salvage
        # Runs whenever the verdict was NOT delivered as an official review —
        # including delivered=comment: a verdict-marker comment is a valid
        # delivery, but if the platform merely refused the FIRST submit (a
        # transient 422/5xx class) this pass upgrades the dumped/marker
        # comment into an OFFICIAL review pinned to the head SHA, which is
        # strictly better for consumers (branch protection reads reviews).
        # When the platform truly refuses bot approvals, the salvage POST
        # fails (422), the script exits non-zero after emitting
        # salvaged=false, and continue-on-error lets the verify gate accept
        # the marker comment as the delivered verdict.
        #
        # continue-on-error: a transient failure here (the GitHub API blip
        # class the retry exists for) must NOT stop the job — the retry step
        # below runs when salvaged != 'true' (the script emits salvaged=false
        # up-front, so an unset output from a crashed step also proceeds).
        continue-on-error: true
        if: always() && steps.check-verdict.outputs.delivered != 'review'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .ai-workflows/scripts/salvage-verdict.sh

      - name: Run OpenCode (bounded retry)
        # One retry of the LLM review when neither the first run nor the
        # salvage produced a verdict (transient model/API failures — e.g. a
        # provider 429 or a GitHub API blip killing the permission check).
        # Bounded to exactly one extra attempt; if this also fails to
        # deliver, a final salvage pass runs, then the verify gate fails the
        # job visibly.
        #
        # Condition: delivered == 'false' AND salvage did not succeed. A
        # comment-channel verdict (delivered == 'comment') skips the retry —
        # the verdict IS delivered; re-running the LLM would burn a full
        # review attempt to relearn what the marker comment already says.
        #
        # `!= 'true'` (rather than `== 'false'`) tolerates the unset output
        # from a salvage step that crashed on a transient API failure, while
        # the delivered=='false' guard still skips this when the verdict
        # already landed (so a skipped/never-run salvage cannot re-run the
        # LLM unnecessarily). The pre-flight gate keeps the retry from
        # re-attempting a structurally refused author.
        if: always() && steps.check-verdict.outputs.delivered == 'false' && steps.salvage.outputs.salvaged != 'true' && steps.preflight.outputs.author_allowed != 'false'
        env:
          MODEL: openai-compatible/default
          AGENT: ""
          SHARE: "false"
          PROMPT: ${{ env.OPENCODE_PROMPT }}
          USE_GITHUB_TOKEN: "true"
          MENTIONS: ""
          VARIANT: ""
          OIDC_BASE_URL: ""
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .ai-workflows/scripts/opencode-cli/run.sh
        continue-on-error: true

      - name: Salvage dumped verdict (after retry)
        # The retry run can itself dump a review-shaped comment instead of
        # creating an official review (the same failure class as the first
        # run). Re-run salvage against the post-retry comment stream so the
        # retry's verdict is not wasted.
        #
        # Gated on salvaged != 'true' as well: when the FIRST salvage
        # succeeded, posting an official review does not remove the dumped
        # comment, so an ungated run here would POST A DUPLICATE review.
        id: salvage-retry
        continue-on-error: true
        if: always() && steps.check-verdict.outputs.delivered == 'false' && steps.salvage.outputs.salvaged != 'true' && steps.preflight.outputs.author_allowed != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .ai-workflows/scripts/salvage-verdict.sh

      - name: Verify review submitted
        # Source of truth for the job's pass/fail: was a verdict delivered
        # against this PR's HEAD commit through EITHER channel — an official
        # APPROVED/CHANGES_REQUESTED bot review, or (the issue-#46 fallback)
        # a sha-pinned verdict-marker comment posted when GitHub refused the
        # review event itself? Two-channel logic lives in
        # scripts/check-verdict.sh. If opencode crashed before delivering AND
        # salvage had nothing to recover, this step fails the job even though
        # the Run OpenCode steps' own exit status was masked via
        # continue-on-error above. Red failure is reserved for NEITHER
        # channel having posted — never a silent green.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          delivered="$(.ai-workflows/scripts/check-verdict.sh | sed -n 's/^Verdict delivery channel: \([a-z]*\).*/\1/p')"
          case "${delivered}" in
            review)
              echo "Official bot verdict on record against HEAD ${PR_HEAD_SHA} — delivered."
              ;;
            comment)
              echo "Verdict delivered as a marker comment against HEAD ${PR_HEAD_SHA} (official review channel refused/unavailable — issue #46 fallback)."
              ;;
            *)
              echo "ERROR: no verdict delivered on PR #${PR_NUMBER} against HEAD ${PR_HEAD_SHA} through either channel (official review OR marker comment). Attempts: 1 run + 1 salvage + 1 retry. Failing the job." >&2
              exit 1
              ;;
          esac

      - name: Post AI command reference (once per thread)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.pull_request.number }}
          PROMPTS_DIR: .github/prompts
        run: .ai-workflows/scripts/post-footer.sh
