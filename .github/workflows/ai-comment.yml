# AI Commands (reusable) — handles slash-command comments on issues and PRs.
#
# Caller contract (consumer's .github/workflows/ai-comment.yml):
#
#   name: AI Commands
#   on:
#     issue_comment: { types: [created] }
#     pull_request_review_comment: { types: [created] }
#   permissions:                          # REQUIRED — see Lessons Learned #2
#     id-token: write
#     contents: write                     # write — allows code changes
#     issues: write
#     pull-requests: write
#   jobs:
#     respond:
#       if: |
#         (startsWith(github.event.comment.body, '/ai') || … ) &&
#         (github.event.comment.author_association == 'OWNER' || …)
#       uses: lenaxia/ai-workflows/.github/workflows/ai-comment.yml@v0.2.0
#       secrets: inherit
#       with:
#         version: v0.2.0
#         project_name: myrepo
#         runs_on: ubuntu-latest    # optional; self-hosted consumers pass their label
#
# The `uses:` ref MUST be a hardcoded tag (no vars context — see README
# Lessons Learned #1). The `if:` filter must stay in the caller (see #4).
# `runs_on` defaults to ubuntu-latest; self-hosted consumers (e.g. gokore)
# pass their own runner label so AI jobs don't silently move to GitHub-hosted runners.
#
# NOTE on checkouts: this workflow checks out BOTH the consumer repo (default
# checkout, for the prompts the consumer has rendered into .github/prompts/ —
# including commands-footer.md) AND this central repo at the pinned version
# (for route-command.sh and post-footer.sh).

name: AI Commands (reusable)

on:
  workflow_call:
    inputs:
      version:
        description: "ai-workflows tag or sha to source scripts from"
        type: string
        required: true
      project_name:
        description: "Consumer project name (injected into prompt context)"
        type: string
        required: true
      runs_on:
        description: "Runner label(s) for the job (default ubuntu-latest). Self-hosted consumers pass their own label."
        type: string
        required: false
        default: ubuntu-latest
      trusted_app_bots:
        description: "JSON array of exact app-bot logins (e.g. [\"my-app[bot]\"]) admitted past the opencode startup permission assert. App bots can never be collaborators (getCollaboratorPermissionLevel returns 'none' for them), so without this entry every /review they post is refused pre-LLM even when the caller's admission gate admits them — EXCEPT ai-workflows-propagation[bot], always trusted (this pipeline's own propagation bot; see scripts/default-trusted-bots.sh). Listed commenters run in TOKEN mode; all other actors still pass the collaborator assert. Each entry is a deliberate trust decision — never wildcards, never human logins."
        type: string
        required: false
        default: "[]"

# Central AI provider defaults — version-controlled here so consumers that
# are happy with the default model/endpoint configure nothing. Precedence:
# a consumer's own OPENAI_MODEL variable / OPENAI_API_BASE secret (set in
# that repo) overrides these values. The API key itself is always a
# per-repo secret (OPENAI_API_KEY) — it is never defaulted here.
env:
  AI_DEFAULT_MODEL: glm-5.3-flash
  AI_DEFAULT_API_BASE: https://ai.thekao.cloud/v1

jobs:
  respond:
    runs-on: ${{ inputs.runs_on }}
    concurrency:
      group: >-
        ${{ (startsWith(github.event.comment.body, '/review')
        || contains(github.event.comment.body, ' /review')
        || startsWith(github.event.comment.body, '/ai')
        || contains(github.event.comment.body, ' /ai'))
        && format('ai-review-{0}', github.event.issue.number || github.event.pull_request.number)
        || format('ai-cmd-{0}-{1}', github.event.issue.number || github.event.pull_request.number, github.event.comment.id) }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout ai-workflows (pinned)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: lenaxia/ai-workflows
          ref: ${{ inputs.version }}
          path: .ai-workflows
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep ai-workflows out of consumer git index
        # See pr-review.yml for the full rationale. In short: this nested
        # checkout carries its own .git, opencode's end-of-run `git add -A`
        # would otherwise sweep it into the consumer index as a gitlink, and
        # actions/checkout's post-job cleanup would emit `fatal: No url
        # found for submodule path '.ai-workflows' in .gitmodules`. The
        # exclude is local to this checkout (never committed). See issue #17.
        run: printf '.ai-workflows/\n' >> .git/info/exclude

      - name: Configure git identity
        # Self-hosted ubuntu runners in this org don't ship a default git
        # user.name/user.email, so `git commit` from the OpenCode step fails
        # with "empty ident name ... not allowed" whenever the AI creates a
        # branch/PR. Set an explicit identity (GitHub's canonical bot no-reply).
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build prompt
        # Also exports COMMAND / PR_HEAD_SHA / PR_CONTEXT to GITHUB_OUTPUT:
        # the /review delivery tail below gates on them. Without that tail a
        # /review that fails to submit its verdict concludes GREEN (the
        # silent-success cell of this workflow) — pull_request events can be
        # lost (LLMSafeSpaces #1704/#1707 outage class), making /review the
        # recovery path, so its delivery must be gated like pr-review.yml.
        id: build
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_HEAD_SHA=""
          PR_CONTEXT=false
          if [ -n "$PR_URL" ] || [ "$EVENT_NAME" = "pull_request_review_comment" ]; then
            PR_CONTEXT=true
            PR_HEAD_SHA="$(gh pr view "$ISSUE_NUMBER" --repo "$REPOSITORY" --json headRefOid -q .headRefOid 2>/dev/null || true)"
          fi
          export PR_HEAD_SHA
          source .ai-workflows/scripts/route-command.sh
          PROMPTS_DIR=.github/prompts OUT_FILE=/tmp/opencode_prompt.txt route_command
          {
            echo "OPENCODE_PROMPT<<__PROMPT_EOF__"
            cat "$OUT_FILE"
            echo "__PROMPT_EOF__"
          } >> "$GITHUB_ENV"
          {
            echo "COMMAND=${COMMAND}"
            echo "PR_HEAD_SHA=${PR_HEAD_SHA}"
            echo "PR_CONTEXT=${PR_CONTEXT}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve opencode auth (trusted app bots)
        # Mirror of the pr-review.yml authmode step, with the COMMENTER as
        # the actor: the CLI assert checks the comment author on comment
        # events. App-bot commenters structurally return 'none' from the
        # collaborator check, so a bot that the caller's admission gate
        # deliberately admitted (#1710 exact-login arm) still dies at the
        # assert. When the commenter is on the caller's trusted_app_bots
        # list, export TOKEN=<job token> (the assert's only bypass —
        # useEnvGithubToken() reads process.env["TOKEN"]); otherwise the
        # output is empty (falsy in JS) and the assert keeps enforcing.
        # Fail-closed on malformed list JSON. Trust = the default-trusted
        # set (scripts/default-trusted-bots.sh) UNION this caller input.
        id: authmode
        env:
          ACTOR: ${{ github.event.comment.user.login }}
          TRUSTED_APP_BOTS: ${{ inputs.trusted_app_bots }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .ai-workflows/scripts/trusted-bot-auth.sh

      - name: Run OpenCode
        # Self-hosted patched CLI via .ai-workflows/scripts/opencode-cli/run.sh
        # (replaces anomalyco/opencode/github@<sha> — the released CLI's live
        # github handler refuses app-bot actors; see scripts/opencode-cli/).
        # Env contract mirrors the composite's inner step.
        env:
          MODEL: openai-compatible/default
          AGENT: ""
          SHARE: "false"
          PROMPT: ${{ env.OPENCODE_PROMPT }}
          USE_GITHUB_TOKEN: "true"
          MENTIONS: /ai
          VARIANT: ""
          OIDC_BASE_URL: ""
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE || env.AI_DEFAULT_API_BASE }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || env.AI_DEFAULT_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .ai-workflows/scripts/opencode-cli/run.sh

      - name: Check verdict delivered
        # /review-on-PR delivery gate (two-channel logic in
        # scripts/check-verdict.sh — mirrors pr-review.yml). Other commands
        # and issue-context /review are out of scope: they have no PR verdict
        # deliverable. Requires a resolved head SHA; the unresolvable case is
        # owned by the verify gate below, which fails loudly on it.
        id: check-verdict
        if: always() && steps.build.outputs.COMMAND == '/review' && steps.build.outputs.PR_CONTEXT == 'true' && steps.build.outputs.PR_HEAD_SHA != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ steps.build.outputs.PR_HEAD_SHA }}
        run: .ai-workflows/scripts/check-verdict.sh

      - name: Salvage dumped verdict
        # Same upgrade pass as pr-review.yml: a dumped (or marker) comment
        # becomes an OFFICIAL review whenever the platform allows it.
        id: salvage
        continue-on-error: true
        if: always() && steps.build.outputs.COMMAND == '/review' && steps.build.outputs.PR_CONTEXT == 'true' && steps.build.outputs.PR_HEAD_SHA != '' && steps.check-verdict.outputs.delivered != 'review'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ steps.build.outputs.PR_HEAD_SHA }}
        run: .ai-workflows/scripts/salvage-verdict.sh

      - name: Verify review submitted
        # Source of truth for /review delivery: red only when NEITHER the
        # official review channel NOR the marker-comment fallback posted.
        # Runs even when PR_HEAD_SHA resolved empty — an unresolvable head
        # SHA fails loudly here rather than silently skipping the gate.
        if: always() && steps.build.outputs.COMMAND == '/review' && steps.build.outputs.PR_CONTEXT == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ steps.build.outputs.PR_HEAD_SHA }}
        run: |
          set -euo pipefail
          if [ -z "${PR_HEAD_SHA}" ]; then
            echo "ERROR: /review on PR #${PR_NUMBER} could not resolve the PR head SHA — cannot verify verdict delivery. Failing the job." >&2
            exit 1
          fi
          delivered="$(.ai-workflows/scripts/check-verdict.sh | sed -n 's/^Verdict delivery channel: \([a-z]*\).*/\1/p')"
          case "${delivered}" in
            review)
              echo "Official bot verdict on record against HEAD ${PR_HEAD_SHA} — delivered."
              ;;
            comment)
              echo "Verdict delivered as a marker comment against HEAD ${PR_HEAD_SHA} (official review channel refused/unavailable — issue #46 fallback)."
              ;;
            *)
              echo "ERROR: /review did not deliver a verdict on PR #${PR_NUMBER} against HEAD ${PR_HEAD_SHA} through either channel. Failing the job." >&2
              exit 1
              ;;
          esac

      - name: Post AI command reference (once per thread)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          PROMPTS_DIR: .github/prompts
        run: .ai-workflows/scripts/post-footer.sh
