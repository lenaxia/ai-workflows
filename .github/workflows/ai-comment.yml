# AI Commands (reusable) — handles slash-command comments on issues and PRs.
#
# Caller contract (consumer's .github/workflows/ai-comment.yml):
#
#   name: AI Commands
#   on:
#     issue_comment: { types: [created] }
#     pull_request_review_comment: { types: [created] }
#   permissions:                          # REQUIRED — see Lessons Learned #2
#     id-token: write
#     contents: write                     # write — allows code changes
#     issues: write
#     pull-requests: write
#   jobs:
#     respond:
#       if: |
#         (startsWith(github.event.comment.body, '/ai') || … ) &&
#         (github.event.comment.author_association == 'OWNER' || …)
#       uses: lenaxia/ai-workflows/.github/workflows/ai-comment.yml@v0.2.0
#       secrets: inherit
#       with:
#         version: v0.2.0
#         project_name: myrepo
#
# The `uses:` ref MUST be a hardcoded tag (no vars context — see README
# Lessons Learned #1). The `if:` filter must stay in the caller (see #4).
#
# NOTE on checkouts: this workflow checks out BOTH the consumer repo (default
# checkout, for the prompts the consumer has rendered into .github/prompts/)
# AND this central repo at the pinned version (for route-command.sh,
# post-footer.sh, and the commands-footer.md fallback).

name: AI Commands (reusable)

on:
  workflow_call:
    inputs:
      version:
        description: "ai-workflows tag or sha to source scripts from"
        type: string
        required: true
      project_name:
        description: "Consumer project name (injected into prompt context)"
        type: string
        required: true

jobs:
  respond:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout ai-workflows (pinned)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: lenaxia/ai-workflows
          ref: ${{ inputs.version }}
          path: .ai-workflows
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        # Self-hosted ubuntu runners in this org don't ship a default git
        # user.name/user.email, so `git commit` from the OpenCode step fails
        # with "empty ident name ... not allowed" whenever the AI creates a
        # branch/PR. Set an explicit identity (GitHub's canonical bot no-reply).
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build prompt
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          source .ai-workflows/scripts/route-command.sh
          PROMPTS_DIR=.github/prompts OUT_FILE=/tmp/opencode_prompt.txt route_command
          {
            echo "OPENCODE_PROMPT<<__PROMPT_EOF__"
            cat "$OUT_FILE"
            echo "__PROMPT_EOF__"
          } >> "$GITHUB_ENV"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@0cf0294787322664c6d668fa5ab0a9ce26796f78 # github-v1.2.9
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: openai-compatible/default
          use_github_token: "true"
          share: "false"
          mentions: /ai
          prompt: ${{ env.OPENCODE_PROMPT }}

      - name: Post AI command reference (once per thread)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          PROMPTS_DIR: .ai-workflows/templates/prompts
        run: .ai-workflows/scripts/post-footer.sh
