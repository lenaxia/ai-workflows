# AI Commands (self / dogfood) — runs this repo's own reusable ai-comment
# workflow on its own PRs/issues, so slash commands (/review, /ai, /fix,
# /implement, ...) work on this repo instead of silently no-oping.
#
# Why a separate file: the reusable workflow definition already occupies
# .github/workflows/ai-comment.yml (on: workflow_call). A caller needs a
# distinct filename. The `self-` prefix signals self-consumption, mirroring
# self-pr-review.yml.
#
# This is the live validation layer for command routing: an issue_comment here
# triggers the real router (route-command.sh) + LLM call + footer posting at
# the pinned tag — none of which `go test` covers.
#
# Requires repo secrets OPENAI_API_KEY / OPENAI_API_BASE and variable
# OPENAI_MODEL (inherited via secrets: inherit).
#
# Note on prompts: this repo's .github/prompts/ currently ships context.md,
# core-rules.md, pr-review.md, and commands-footer.md. Commands that need a
# prompt not present there (e.g. fix.md for /fix, implement.md for /implement)
# will fail at prompt assembly until the full prompt set is committed.
name: AI Commands (self)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  respond:
    if: |
      (startsWith(github.event.comment.body, '/ai') ||
       startsWith(github.event.comment.body, '/review') ||
       startsWith(github.event.comment.body, '/fix') ||
       startsWith(github.event.comment.body, '/implement') ||
       startsWith(github.event.comment.body, '/analyze') ||
       startsWith(github.event.comment.body, '/test') ||
       startsWith(github.event.comment.body, '/security') ||
       startsWith(github.event.comment.body, '/explain') ||
       startsWith(github.event.comment.body, '/triage') ||
       startsWith(github.event.comment.body, '/help') ||
       startsWith(github.event.comment.body, '/design') ||
       startsWith(github.event.comment.body, '/merge') ||
       contains(github.event.comment.body, ' /ai') ||
       contains(github.event.comment.body, ' /review') ||
       contains(github.event.comment.body, ' /fix') ||
       contains(github.event.comment.body, ' /implement') ||
       contains(github.event.comment.body, ' /analyze') ||
       contains(github.event.comment.body, ' /test') ||
       contains(github.event.comment.body, ' /security') ||
       contains(github.event.comment.body, ' /explain') ||
       contains(github.event.comment.body, ' /triage') ||
       contains(github.event.comment.body, ' /help') ||
       contains(github.event.comment.body, ' /design') ||
       contains(github.event.comment.body, ' /merge')) &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    uses: lenaxia/ai-workflows/.github/workflows/ai-comment.yml@v0.2.1
    secrets: inherit
    with:
      version: v0.2.1
      project_name: ai-workflows
